name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly freshness check — resolves the newest in-range dependencies so the
    # template can't silently rot against new @plocks/ui releases.
    - cron: '0 6 * * 1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx expo export --platform web
